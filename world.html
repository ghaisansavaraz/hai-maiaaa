<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#05070f" />
  <title>Lovelier Than the Moon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2280%22>⚘</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/world.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "./js/vendor/three/three.module.min.js",
        "three/addons/": "./js/vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <canvas id="worldCanvas" aria-label="A moonlit place"></canvas>

  <div id="loading" class="screen">
    <div class="screen-inner">
      <div class="moon-dot"></div>
      <p class="loading-text"></p>
    </div>
  </div>

  <div id="intro" class="screen hidden">
    <div class="screen-inner">
      <p class="kicker">for <span data-name>Maia Reva</span></p>
      <h1 class="title">lovelier than the moon</h1>
      <button id="enterBtn" class="enter">click to enter</button>
      <div class="controls">
        <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk</span>
        <span><kbd>mouse</kbd> look</span>
        <span><kbd>click</kbd> touch things</span>
        <span><kbd>shift</kbd> stroll faster</span>
        <span><kbd>M</kbd> sound</span>
        <span><kbd>esc</kbd> pause</span>
      </div>
    </div>
  </div>

  <div id="pause" class="screen hidden">
    <div class="screen-inner">
      <h2 class="title small">the night holds its breath</h2>
      <button id="resumeBtn" class="enter">wander a little longer</button>
      <div class="pause-row">
        <button id="muteBtn2" class="ghost icon-btn" aria-label="sound on" title="sound">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
            <g class="mute-x"><path d="M3 3l18 18"/></g>
          </svg>
        </button>
        <a class="ghost" href="index.html">say goodnight</a>
      </div>
    </div>
  </div>

  <div id="crosshair"></div>
  <div id="prompt"></div>
  <div id="hint"></div>
  <div id="story">follow Mr. Frundles</div>

  <div id="card" class="card" aria-live="polite">
    <div class="card-inner">
      <div class="card-ornament">✦</div>
      <h2 class="card-title"></h2>
      <p class="card-body"></p>
      <p class="card-sign"></p>
      <p class="card-close">click to close</p>
    </div>
  </div>

  <div id="fade" class="fade"></div>

  <div id="dev" class="dev hidden">
    <div class="dev-box">
      <div class="dev-gate">
        <p>developer access</p>
        <input id="devPass" type="password" inputmode="numeric" autocomplete="off" placeholder="passcode" />
        <p id="devErr" class="dev-err"></p>
      </div>
      <div class="dev-tools hidden">
        <p>dev tools</p>
        <button data-dev="unlock">preview birthday ending</button>
        <button data-dev="spawn">go to entrance</button>
        <button data-dev="dock">go to dock</button>
        <button data-dev="greenhouse">go to greenhouse</button>
        <button data-dev="hill">go to hilltop</button>
        <button data-dev="pier">go to pier</button>
        <button data-dev="bridge">go to bridge</button>
        <button data-dev="story">restart the story</button>
        <button data-dev="fps">toggle fps</button>
        <button data-dev="close">close</button>
        <p id="devFps" class="dev-err"></p>
      </div>
    </div>
  </div>

  <script type="module" src="js/world/main.js"></script>
</body>
</html>
